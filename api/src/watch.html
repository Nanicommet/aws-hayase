<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Hayase Player</title>
<style>
  :root{color-scheme:dark light;--bg:#0b0b0d;--fg:#eee;--mut:#8a8a93;--card:#17171b;--acc:#7c9cff}
  @media (prefers-color-scheme:light){:root{--bg:#fafafa;--fg:#111;--mut:#666;--card:#fff;--acc:#2b50e6}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:12px}
  h1{font-size:18px;margin:6px 0 12px}
  .row{display:flex;gap:8px}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #333;background:var(--card);color:var(--fg)}
  input{flex:1;min-width:0}button{cursor:pointer;background:var(--acc);border:0;color:#fff}
  button.ghost{background:var(--card);color:var(--fg);border:1px solid #333}
  .src{margin:14px 0 6px;color:var(--mut);font-size:13px}
  .item{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin:6px 0;cursor:pointer}
  .item img{width:44px;height:62px;object-fit:cover;border-radius:6px;background:#222}
  .ep{display:inline-block;margin:4px;padding:8px 12px;border-radius:8px;background:var(--card);cursor:pointer}
  video{width:100%;max-height:60vh;background:#000;border-radius:10px;margin:8px 0}
  .mut{color:var(--mut)}.err{color:#ff7b7b}
</style></head><body><main>
<h1>AWS Hayase Player</h1>
<div class="row"><input id="q" placeholder="Search anime…" enterkeyhint="search"><button id="go">Search</button></div>
<div class="row" style="margin-top:8px"><input id="key" type="password" placeholder="Access key (if required)"><button class="ghost" id="saveKey">Save</button></div>
<div id="status" class="mut" style="margin:10px 0"></div>
<video id="player" controls playsinline hidden></video>
<div id="qualities"></div>
<div id="view"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
var $ = function(id){return document.getElementById(id)};
var view=$('view'), statusEl=$('status'), player=$('player'), hls=null;
var params=new URLSearchParams(location.search);
if(params.get('key')){try{localStorage.setItem('hk',params.get('key'))}catch(e){}}
var KEY=''; try{KEY=localStorage.getItem('hk')||''}catch(e){}
$('key').value=KEY;
$('saveKey').onclick=function(){KEY=$('key').value.trim();try{localStorage.setItem('hk',KEY)}catch(e){};say('Key saved.')};
function say(t,err){statusEl.textContent=t;statusEl.className=err?'err':'mut'}
function h(tag,props){var e=document.createElement(tag);for(var k in (props||{}))e[k]=props[k];for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c!=null)e.append(c)}return e}
function api(path){return fetch(path,{headers:KEY?{'x-hayase-key':KEY}:{}}).then(function(r){
  if(r.status===401)throw new Error('Access key required or wrong — enter it above.');
  return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j})})}

$('go').onclick=search; $('q').onkeydown=function(e){if(e.key==='Enter')search()};

function search(){
  var q=$('q').value.trim(); if(!q)return;
  view.replaceChildren(); say('Searching sources… this can take up to a minute.');
  api('/api/search?q='+encodeURIComponent(q)).then(function(d){
    say('Searched '+d.searched+' sources · '+d.results.length+' with results · '+d.errors.length+' failed');
    d.results.forEach(function(g){
      view.append(h('div',{className:'src',textContent:g.source.name+' ('+g.source.lang+')'}));
      g.items.forEach(function(it){
        view.append(h('div',{className:'item',onclick:function(){episodes(g.source,it)}},
          h('img',{src:it.thumbnail||'',loading:'lazy',referrerPolicy:'no-referrer'}),
          h('div',{textContent:it.title})));
      });
    });
  }).catch(function(e){say(e.message,true)});
}

function episodes(src,item){
  view.replaceChildren(h('button',{className:'ghost',textContent:'← Back',onclick:search}),h('h3',{textContent:item.title}));
  say('Loading episodes…');
  api('/api/source/'+encodeURIComponent(src.id)+'/episodes?url='+encodeURIComponent(item.url)).then(function(list){
    say(list.length+' episodes');
    list.slice().reverse().forEach(function(ep){
      view.append(h('span',{className:'ep',textContent:ep.name||('Ep '+ep.episode_number),onclick:function(){videos(src,ep)}}));
    });
  }).catch(function(e){say(e.message,true)});
}

function videos(src,ep){
  $('qualities').replaceChildren(); say('Resolving video…');
  api('/api/source/'+encodeURIComponent(src.id)+'/videos?url='+encodeURIComponent(ep.url)).then(function(vs){
    vs=vs.filter(function(v){return v.videoUrl});
    if(!vs.length){say('No playable video from this source.',true);return}
    say(vs.length+' streams — pick a quality');
    vs.forEach(function(v,i){$('qualities').append(h('button',{className:i?'ghost':'',style:'margin:4px',textContent:v.quality||('Stream '+(i+1)),onclick:function(){play(v)}}))});
    play(vs[0]);
  }).catch(function(e){say(e.message,true)});
}

function play(v){
  if(hls){hls.destroy();hls=null}
  player.hidden=false; player.replaceChildren();
  (v.subtitleTracks||[]).forEach(function(t,i){player.append(h('track',{kind:'subtitles',src:t.url,srclang:(t.lang||'en').slice(0,2),label:t.lang||('Sub '+(i+1))}))});
  var u=v.videoUrl, isHls=/\.m3u8(\?|$)/i.test(u)||/m3u8/i.test(v.quality||'');
  if(isHls&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(player)}
  else{player.src=u}
  player.play().catch(function(){});
  player.scrollIntoView({behavior:'smooth'});
}
</script></body></html>
