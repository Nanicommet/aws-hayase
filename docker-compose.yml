services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      EXTENSION_SERVER_URL: http://runtime:8080
      FLARESOLVERR_URL: http://flaresolverr:8191
      API_TOKEN: ${API_TOKEN:-}
      HAYASE_KEY: ${HAYASE_KEY:-}
      SUBTITLE_INDEXER_URL: ${SUBTITLE_INDEXER_URL:-}
      NZB_INDEXER_URL: ${NZB_INDEXER_URL:-}
      DEFAULT_LANGS: ${DEFAULT_LANGS:-en,all}
      ALLOW_NSFW: ${ALLOW_NSFW:-0}
      SEARCH_CONCURRENCY: ${SEARCH_CONCURRENCY:-4}
      CACHE_MAX_GB: ${CACHE_MAX_GB:-5}
      PREPARE_WAIT_SEC: ${PREPARE_WAIT_SEC:-90}
    volumes: [api_data:/data]
    depends_on: [runtime, flaresolverr]
    # Loopback by default; Caddy (profile "https") is the public entry point.
    # Set APP_BIND=0.0.0.0 only for quick HTTP testing.
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"]
    mem_limit: 512m

  runtime:
    build:
      context: ./runtime
      args:
        M_EXT_REF: ${M_EXT_REF:-}
    restart: unless-stopped
    expose: ["8080"]
    environment:
      # Java (unlike Android) won't fetch missing intermediate certs unless told to.
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Dcom.sun.security.enableAIAcaIssuers=true}
    volumes: [extension_cache:/data]
    mem_limit: 768m

  flaresolverr:
    build:
      context: ./flaresolverr
      args:
        FLARESOLVERR_TAG: ${FLARESOLVERR_TAG:-latest}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      PROXY_URL: ${FLARE_PROXY:-}
      TZ: ${TZ:-Africa/Tunis}
    expose: ["8191"]
    mem_limit: 1g

  # Optional: sends source traffic out through Cloudflare WARP instead of the AWS address.
  # Switch with ./warp.sh on|off (adds the "warp" profile and the proxy settings below).
  warp:
    image: caomingjun/warp
    profiles: ["warp"]
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 10:200 rwm'
    cap_add: [NET_ADMIN, MKNOD, AUDIT_WRITE]
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WARP_SLEEP: "5"
    volumes: [warp_data:/var/lib/cloudflare-warp]
    expose: ["1080"]
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  warp_data:
  api_data:
  extension_cache:
  caddy_data:
